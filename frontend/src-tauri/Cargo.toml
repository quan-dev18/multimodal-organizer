[package]
name = "mmo-app"
version = "0.1.0"
description = "MMO - Multimodal Organizer Desktop App"
authors = ["MMO Dev Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "mmo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
walkdir = "2.5"
sha2 = "0.10"
trash = "5.2"
sysinfo = "0.33"
chrono = "0.4"
